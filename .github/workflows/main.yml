name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check PHP syntax errors
        run: find . -name "*.php" -exec php -l {} \;

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'     # Active LTS
          cache: 'npm'           # speeds up repeat runs

      - name: Install JS dependencies
        run: npm ci              # strict + reproducible

      - name: Build Tailwind CSS
        run: npm run build       # defined in package.json
